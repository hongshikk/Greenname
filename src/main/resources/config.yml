# GreenName config
# 语言选项 (语言名称用该语言本身书写):
#   zh      - 简体中文 (中国)
#   zh_tw   - 繁體中文 (台灣)
#   en      - English (USA / UK)
#   ru      - Русский (Россия)
#   de      - Deutsch (Deutschland)
#   fr      - Français (France)
#   es      - Español (España)
#   pt      - Português (Brasil)
#   ja      - 日本語 (日本)
#   ko      - 한국어 (대한민국)
#   id      - Bahasa Indonesia (Indonesia)
#   ar      - العربية (السعودية / مصر)
#
language: zh
# 聊天格式，& 为颜色代码，必须包含两个 %s
# 示例: "&a<%s>&d %s"  效果: 绿色<玩家名>淡紫色 消息
# Chat format, '&' is the color code, must contain two %s placeholders
# Example: "&a<%s>&d %s"  →  Green<playername>LightPurple message
chat-format: "&a<%s>&d %s"